<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fenergo — Superbaby Demo Stage</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #0b1f22; /* fallback while the screenshot loads */
    overflow-x: hidden;
  }

  .site-background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background-image: url('https://i.imgur.com/9UBHTpb.png');
    background-size: cover;
    background-position: top center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  /* Small, unobtrusive internal-only label so this never gets mistaken for the live site */
  .stage-tag {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 5px 10px;
    border-radius: 4px;
    pointer-events: none;
  }
</style>
</head>
<body>

  <!-- Static screenshot of the Fenergo site, used as the demo backdrop -->
  <div class="site-background"></div>

  <!-- Internal marker only -- not part of the live site -->
  <div class="stage-tag">INTERNAL DEMO STAGE — Fenergo × 1mind</div>

  <!-- 1mind Superbaby widget launch code -->
  <script src="https://launcher.1mind.com/deployment-rv9mj5qdfs" async></script>

</body>
</html>
